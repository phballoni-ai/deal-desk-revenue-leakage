name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python dealdesk.py --out output
      - run: test -s output/deal_desk.xlsx && test -s output/executive_brief.pdf && test -s output/commercial_bridge.png && test -s output/risk_map.png
